[project]
name = "setupdev"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=15.0.0",
    "sh>=2.2.2",
    "typer>=0.24.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[project.scripts]
setupdev = "setupdev.cli.main:app"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
